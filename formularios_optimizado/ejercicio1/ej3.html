<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel de estudios</title>
</head>
<body>
    <form action="enviar.php" method="post">
        <fieldset>
            <legend>Seleccione el nivel máximo de estudios que tiene</legend>

            <input type="radio" name="estudios" id="sin_estudios" value="1">

            <input type="radio" name="estudios" id="primario" value="2">

            <input type="radio" name="estudios" id="secundario" value="3">
