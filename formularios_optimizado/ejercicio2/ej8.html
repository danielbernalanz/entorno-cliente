<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campos de solo lectura</title>
</head>
<body>
    <form action="" method="post">
        <label for="empresa">Empresa</label>
        <input type="text" name="empresa" id="empresa" readonly value="Empresa ejemplo">
        <br><br>

        <label for="contrato">Contrato</label>
        <br>
        <textarea name="contrato" id="contrato" rows="5" cols="40" readonly>Este es el texto del contrato</textarea>
    </form>
</body>
</html>
