<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <form method="post">
        <h1>Resultado:</h1>
        <input type="text" name="resultado" value="0" readonly>
        <br><br>

        <button type="button">7</button> <button type="button">8</button>
        <button type="button">9</button> <button type="button">/</button>
        <br>
        <button type="button">4</button> <button type="button">5</button>
        <button type="button">6</button> <button type="button">*</button>
        <br>
        <button type="button">1</button> <button type="button">2</button>
        <button type="button">3</button> <button type="button">+</button>
        <br>
        <button type="button">0</button> <button type="button">=</button>
        <button type="button">-</button>
    </form>
</body>
</html>
