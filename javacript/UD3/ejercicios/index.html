    <button onclick="imprimirNumeros()">Imprimir</button>
    <script>
        function imprimirNumeros() {
            for (i = 0; i < 500; i++) {
                if (i % 3 == 0 && !esPrimo(i)) {
                    document.body.innerHTML += i + " "
                }
            }
        }
        function esPrimo(numero) {
            entresimismo = numero % numero == 0
            entreuno = numero % 1 == 0
            entrelosdemas = false;
            for (i = 2; i < numero; i++) {
                if (numero % i == 0) {
                    entrelosdemas = true;
                }
            }
            if (entresimismo && entreuno && !entrelosdemas) {
                return true
            }
            return false
        }

    </script>

    <button onclick="mayorymenor()">Ejecutar</button>
    <script>
        function mayorymenor() {
            let array = [prompt("numero 1?"), prompt("numero 2?"), prompt("numero 3?"), prompt("numero 4?"), prompt("numero 5?"), prompt("numero 6?"), prompt("numero 7?"), prompt("numero 8?"), prompt("numero 9?"), prompt("numero 10?")];
            let mayor = array[0]
            for (i = 0; i < array.length; i++) {
                if (array[i] > mayor) {
                    mayor = array[i]
                }
            }
            document.body.innerHTML += "El numero mayor es " + mayor
            let menor = array[1]
            for (i = 0; i < array.length; i++) {
                if (array[i] < menor) {
                    menor = array[i]
                }
            }
            document.body.innerHTML += "El numero menor es " + menor
            console.log(array.length)
        }

    </script>
    <p>Ejercicio 5:</p>
    <button onclick="tallaf()">Talla</button>
    <script>
        function tallaf() {
            let talla = prompt("Talla?")
            switch (talla) {
                case "XXL":
                case "XL":
                case "L":
                    document.body.innerHTML += "Grande"
                    break;
                case "M":
                    document.body.innerHTML += "Mediano"
                    break;
                case "S":
                case "XS":
                case "XXS":
                    document.body.innerHTML += "Pequeño"
                    break;
            }
        }
    </script>
